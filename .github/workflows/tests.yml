name: Tests

# Separate from the pipeline cron: this one checks the code, so it can run on
# any machine and does not need production credentials.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.4
      - name: Test
        run: python -m pytest tests/ -q
